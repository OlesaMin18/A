<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Выпадающие списк</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h2>№1</h2>
        <select>
            <option>New York</option>
            <option>Minsk</option>
            <option>Moscow</option>
            <option>Warsaw</option>
            <option>Riga</option>
            <option>Rome</option>
        </select>
        <h2>№2</h2>
        <select multiple name="city[]">
            <option>New York</option>
            <option selected>Minsk</option>
            <option>Moscow</option>
            <option selected>Warsaw</option>
            <option>Riga</option>
            <option selected>Roma</option>
        </select>
    </body>
</html>
