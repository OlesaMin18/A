<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Основные элементы HTML формы</title>
</head>
<body>
    <h2>№1</h2>
    <form action="">
        <input type="text" name="name">
        <input type="text" name="surname">
        <button type="submit">Button</button>
    </form>

    <h2>№2</h2>
    <form action="">
        <input type="text" name="field1" style="border: 1px solid red;">
        <input type="text" name="field2" style="border: 1px solid red;">
    </form>
    <h2>№3</h2>
    <form action="">
        <input type="text" name="field1">
        <input type="text" name="field2">
        <input type="text" name="field3">
    </form>
    <h2>№4</h2>
    <form action="">
        <input type="text" name="field1"><br><br>
        <input type="text" name="field2"><br><br>
        <input type="text" name="field3">
    </form>
</body>
</html>
